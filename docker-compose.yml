version: '3.8'
services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
    command: python main.py
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
volumes:
  redis-data:
